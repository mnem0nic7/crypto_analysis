server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to FastAPI service; strip /api prefix.
    # resolver + variable forces nginx to re-resolve the 'api' alias on each
    # request rather than caching IPs at startup (which breaks after container restarts).
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        set $upstream_api api;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$upstream_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
